<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPE Emerald — Pokédex</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pokedex.css" />
  <script src="js/release-context.js"></script>
  <link rel="stylesheet" href="css/header.css" />
</head>
<body class="page-pokedex">
  <script src="js/nav.js"></script>

  <div class="dex-container">
    <div class="dex-controls">
      <input id="dex-search" class="dex-search" type="search" placeholder="Search Pokémon…" autocomplete="off" />
      <div class="dex-type-filters" id="type-filters"></div>
      <label class="dex-forms-toggle">
        <input type="checkbox" id="show-forms" checked /> Show alternate forms
      </label>
    </div>
    <div class="dex-count" id="dex-count"></div>
    <div id="dex-grid" class="dex-grid">
      <div class="dex-loading">Loading Pokédex…</div>
    </div>
  </div>

  <script src="js/pokedex.js"></script>
</body>
</html>
