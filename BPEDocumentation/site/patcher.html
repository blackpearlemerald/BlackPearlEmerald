<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Patch your unmodified Pokémon Emerald ROM with your selected Black Pearl Emerald version." />
  <title>BPE Emerald — Rom Patcher</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="rom-patcher-js/style.css" />
  <link rel="stylesheet" href="css/patcher.css" />
  <script src="rom-patcher-js/RomPatcher.webapp.js"></script>
  <script src="js/release-context.js"></script>
  <link rel="stylesheet" href="css/header.css" />
</head>
<body class="page-patcher">
  <script src="js/nav.js"></script>
  <main class="patcher-shell">
    <h1>Rom Patcher</h1>
    <div id="rom-patcher-container">
      <div class="patcher-flow">
        <div class="patcher-input">
          <label for="rom-patcher-input-file-rom">Pokémon Emerald <span>Unmodified ROM</span></label>
          <input type="file" id="rom-patcher-input-file-rom" class="empty"
            accept=".gba,.zip,application/octet-stream,application/zip" disabled />
        </div>
        <span class="patcher-symbol" aria-hidden="true">+</span>
        <div class="patcher-version">
          <strong>Black Pearl Emerald</strong>
          <span id="bpe-patch-label">Loading version…</span>
        </div>
        <span class="patcher-symbol patcher-arrow" aria-hidden="true">→</span>
        <button id="rom-patcher-button-apply" disabled>Patch &amp; Download</button>
      </div>
      <p id="patcher-status" role="status" aria-live="polite">Loading patch…</p>
      <!-- Required hooks for the bundled patching engine; no extra user controls. -->
      <div hidden>
        <div id="rom-patcher-row-file-patch">
          <select id="rom-patcher-select-patch" aria-label="BPE release patch" tabindex="-1"></select>
        </div>
        <div id="rom-patcher-row-error-message"><span id="rom-patcher-error-message"></span></div>
      </div>
    </div>
    <noscript>Enable JavaScript to use the Rom Patcher.</noscript>
  </main>
  <script src="js/patcher.js"></script>
</body>
</html>
