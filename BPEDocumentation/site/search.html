<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPE Emerald — Global Search</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pokedex.css" />
  <script src="js/release-context.js"></script>
  <link rel="stylesheet" href="css/header.css" />
</head>
<body class="page-search">
  <script src="js/nav.js"></script>

  <div class="search-page">
    <header class="search-hero">
      <h1>Global Search</h1>
      <p>Search across every Pokémon, trainer, item, and location in BPE Emerald.</p>
      <div class="search-box">
        <span class="search-box-ic" aria-hidden="true">⌕</span>
        <input id="global-search" class="search-input" type="search"
               placeholder="Search Pokémon, trainers, items, locations…"
               autocomplete="off" autofocus />
      </div>
      <div class="search-cats" id="search-cats"></div>
    </header>

    <div id="search-status" class="search-status"></div>
    <div id="search-results" class="search-results"></div>
  </div>

  <script src="js/search.js"></script>
</body>
</html>
