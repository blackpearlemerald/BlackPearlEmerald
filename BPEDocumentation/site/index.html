<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=6.0, user-scalable=yes" />
  <title>BPE Emerald — Interactive World Map</title>
  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=20260916-statics" />
  <script src="js/release-context.js"></script>
  <link rel="stylesheet" href="css/header.css" />
</head>
<body class="page-map">
  <div id="map"></div>

  <div id="panel">
    <div id="panel-title">BPE Emerald Map</div>
    <label><input type="checkbox" id="t-trainers" checked /> Trainers</label>
    <label><input type="checkbox" id="t-items" checked /> Items</label>
    <label><input type="checkbox" id="t-hidden" /> Hidden items</label>
    <label><input type="checkbox" id="t-gifts" checked /> Gifts &amp; care packages</label>
    <label><input type="checkbox" id="t-statics" checked /> Legendary &amp; static Pokémon</label>
    <label><input type="checkbox" id="t-guides" checked /> Guides</label>
    <label><input type="checkbox" id="t-warps" checked /> Warp links</label>
    <label><input type="checkbox" id="t-labels" /> Map labels</label>
    <div id="counts"></div>
    <div id="hint">Click a map for wild encounters · click a trainer or item for details</div>
  </div>

  <button id="panel-toggle" aria-label="Toggle panel">☰</button>
  <div id="loading">Loading world…</div>

  <!-- Detail panel: floating card on desktop, full-screen sheet on mobile.
       Content is rendered by app.js (openDetail). -->
  <div id="detail" class="detail" hidden aria-hidden="true">
    <div class="detail-backdrop" data-detail-close></div>
    <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-kind">
      <header class="detail-head">
        <span class="detail-kind" id="detail-kind"></span>
        <button type="button" class="detail-close" aria-label="Close" data-detail-close>✕</button>
      </header>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="lib/leaflet.js"></script>
  <script src="js/world-images.js?v=20260914-canvas"></script>
  <script src="js/map-performance.js?v=20260914-canvas"></script>
  <script src="js/app.js?v=20260924-view"></script>
</body>
</html>
