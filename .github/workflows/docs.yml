name: BPE Documentation

on:
  push:
    branches: [main]
    paths:
      - 'releases/packages/*.zip'
      - 'releases/legacy/*.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      correct_version:
        description: 'Optional: game version whose documentation needs a correction'
        required: false
        type: string
      docs_revision:
        description: 'For corrections: next documentation revision (2, 3, ...). Existing revisions are immutable.'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

# Each run reconciles all packages on current main. A newer queued run therefore
# includes packages from superseded pending runs; published history is retained.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      CORRECT_VERSION: ${{ inputs.correct_version }}
      DOCS_REVISION: ${{ inputs.docs_revision || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r BPEDocumentation/requirements.txt
      - name: Test release package integrity
        run: python -m unittest discover -s BPETools/tests -v
      - name: Test website version routing and calculator storage
        run: node BPETools/tests/test_release_context.cjs
      - name: Test map image geometry and viewport rendering
        run: node BPETools/tests/test_world_images.cjs
      - name: Assemble all published releases and new patch packages
        shell: bash
        run: |
          args=(--github)
          if [ -n "$CORRECT_VERSION" ]; then
            args+=(--correct-version "$CORRECT_VERSION" --docs-revision "$DOCS_REVISION")
          fi
          python BPEDocumentation/scripts/releases.py "${args[@]}"
      - uses: actions/configure-pages@v6
      - name: Upload only the assembled website and patches
        uses: actions/upload-pages-artifact@v5
        with:
          path: .release-work/site
      - name: Deploy versioned documentation
        id: deployment
        uses: actions/deploy-pages@v5
